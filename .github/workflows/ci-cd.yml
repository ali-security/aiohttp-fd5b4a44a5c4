name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector to run only the selected tests'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  COLOR: yes
  FORCE_COLOR: 1  # Request colored output from CLI tools supporting it
  MYPY_FORCE_COLOR: 1
  PY_COLORS: 1

jobs:

  gen_llhttp:
    name: Generate llhttp sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v2.4.0
      with:
        submodules: true
    - name: Cache llhttp generated files
      uses: actions/cache@v4
      id: cache
      with:
        key: llhttp-${{ hashFiles('vendor/llhttp/package.json', 'vendor/llhttp/src/**/*') }}
        path:  vendor/llhttp/build
    - name: Setup NodeJS
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v2
      with:
        node-version: '14'
    - name: Generate llhttp sources
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        make generate-llhttp
    - name: Upload llhttp generated files
      uses: actions/upload-artifact@v4
      with:
        name: llhttp
        path: vendor/llhttp/build
        if-no-files-found: error

  test:
    name: Test
    needs: gen_llhttp
    strategy:
      matrix:
        pyver: [3.6, 3.7, 3.8, 3.9, '3.10']
        no-extensions: ['', 'Y']
        os: [ubuntu-22.04, macos-latest, windows-latest]
        exclude:
          - os: macos-latest
            no-extensions: 'Y'
          - os: macos-latest
            pyver: 3.7
          - os: macos-latest
            pyver: 3.8
          - os: windows-latest
            no-extensions: 'Y'
        experimental: [false]
        include:
          - pyver: pypy-3.8
            no-extensions: 'Y'
            os: ubuntu-latest
            experimental: false
          - os: macos-latest
            pyver: 3.11
            experimental: false
            no-extensions: 'Y'
          - os: ubuntu-latest
            pyver: 3.11
            experimental: false
            no-extensions: 'Y'
          - os: windows-latest
            pyver: 3.11
            experimental: false
            no-extensions: 'Y'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    env:
      PIP_INDEX_URL: https://:2023-10-07T14:27:15.181580Z@time-machines-pypi.sealsecurity.io/
    steps:
    - name: Checkout
      uses: actions/checkout@v2.4.0
      with:
        submodules: true
    - name: Install Python 3.6 from python.org (macOS)
      if: runner.os == 'macOS' && matrix.pyver == '3.6'
      run: |
        curl -fsSL -o /tmp/python-3.6.8.pkg https://www.python.org/ftp/python/3.6.8/python-3.6.8-macosx10.9.pkg
        sudo installer -pkg /tmp/python-3.6.8.pkg -target /
        PYBIN=/Library/Frameworks/Python.framework/Versions/3.6/bin
        sudo ln -sf "$PYBIN/python3" "$PYBIN/python"
        echo "$PYBIN" >> $GITHUB_PATH
        "$PYBIN/python3" -m pip install --upgrade pip
        "$PYBIN/python3" --version
    - name: Setup Python ${{ matrix.pyver }} (legacy build)
      if: >-
        (runner.os == 'macOS' && matrix.pyver != '3.6')
        || (runner.os != 'macOS' && matrix.pyver == '3.6')
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.pyver }}
        cache-build: true
    - name: Setup Python ${{ matrix.pyver }}
      if: runner.os != 'macOS' && matrix.pyver != '3.6'
      id: python-install
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.pyver }}
    - name: Pin Cython < 3 for PyPy (PyYAML 6.0 sdist build)
      if: startsWith(matrix.pyver, 'pypy')
      run: |
        echo 'cython<3' > "${RUNNER_TEMP}/pypy-constraints.txt"
        echo "PIP_CONSTRAINT=${RUNNER_TEMP}/pypy-constraints.txt" >> $GITHUB_ENV
    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "::set-output name=dir::$(python -m pip cache dir)"
    - name: Cache PyPI
      uses: actions/cache@v4
      with:
        key: pip-ci-${{ runner.os }}-${{ matrix.pyver }}-${{ matrix.no-extensions }}-${{ hashFiles('requirements/*.txt') }}
        path: ${{ steps.pip-cache.outputs.dir }}
        restore-keys: |
            pip-ci-${{ runner.os }}-${{ matrix.pyver }}-${{ matrix.no-extensions }}-
    - name: Update pip, wheel, setuptools, build, twine
      run: |
        python -m pip install -U pip wheel setuptools build twine
    - name: Pre-install cffi (pycares setup_requires egg fetch fails on macOS)
      if: runner.os == 'macOS'
      run: |
        python -m pip install cffi
    - name: Install dependencies
      env:
        CFLAGS: ${{ runner.os == 'macOS' && '-Wno-error=int-conversion' || '' }}
      run: |
        python -m pip install -r requirements/test.txt -c requirements/constraints.txt
    - name: Cythonize
      if: ${{ matrix.no-extensions == '' }}
      run: |
        make cythonize
    - name: Restore llhttp generated files
      if: ${{ matrix.no-extensions == '' }}
      uses: actions/download-artifact@v4
      with:
        name: llhttp
        path: vendor/llhttp/build/
    - name: Run unittests
      env:
        COLOR: 'yes'
        AIOHTTP_NO_EXTENSIONS: ${{ matrix.no-extensions }}
        PIP_USER: 1
      run: |
        export PATH="${HOME}/Library/Python/3.11/bin:${HOME}/.local/bin:${PATH}"
        if [ -n "${{ inputs.test-filter }}" ]; then
          make .develop && pytest -q ${{ inputs.test-filter }}
        else
          make test
        fi
      shell: bash
    - name: Explain the platform-dependent skips in this leg
      shell: bash
      run: |
        echo "Skip reasons that are by design of upstream's own test matrix:"
        if [ -n "${{ matrix.no-extensions }}" ]; then
          echo "- AIOHTTP_NO_EXTENSIONS=Y: this leg deliberately tests the pure-Python"
          echo "  implementation, so the C/Cython parser tests ('Requires Cython',"
          echo "  'C based HTTP parser not available') are skipped here; they run and"
          echo "  pass in the extension legs of the same matrix (no-extensions='')."
        fi
        if [ "${{ runner.os }}" = "Windows" ] || { [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.pyver }}" = "3.6" ]; }; then
          echo "- aiodns is not installed on this platform: requirements/base.txt pins"
          echo "  aiodns only for sys_platform linux, and darwin with Python >= 3.7,"
          echo "  because c-ares does not build on Windows / macOS Python 3.6. The"
          echo "  tests/test_resolver.py 'aiodns required' tests run on the Linux legs."
        fi
        if [[ "${{ matrix.pyver }}" == pypy* ]]; then
          echo "- tests/test_web_log.py:31 (multi-line reason, printed empty by -ra):"
          echo "  patching datetime.datetime breaks isinstance() under PyPy; it runs"
          echo "  on every CPython leg."
        fi
    - name: Re-run the failing tests with maximum verbosity
      if: failure()
      env:
        COLOR: yes
        AIOHTTP_NO_EXTENSIONS: ${{ matrix.no-extensions }}
      run: >-  # `exit 1` makes sure that the job remains red with flaky runs
        pytest --no-cov -vvvvv --lf && exit 1
      shell: bash
    - name: Turn coverage into xml
      env:
        COLOR: 'yes'
        PIP_USER: 1
      run: |
        python -m coverage xml

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}

  pre-deploy:
    name: Pre-Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dummy
        run: |
            echo "Predeploy step"

  build-tarball:
    name: Tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-deploy, gen_llhttp]
    steps:
    - name: Checkout
      uses: actions/checkout@v2.4.0
      with:
        submodules: true
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Update pip, wheel, setuptools, build, twine
      run: |
        python -m pip install -U pip wheel setuptools build twine
    - name: Install cython
      run: |
        python -m pip install -r requirements/cython.txt -c requirements/constraints.txt
    - name: Restore llhttp generated files
      uses: actions/download-artifact@v4
      with:
        name: llhttp
        path: vendor/llhttp/build/
    - name: Cythonize
      run: |
        make cythonize
    - name: Make sdist
      env:
        PIP_INDEX_URL: https://:2023-10-07T14:27:15.181580Z@time-machines-pypi.sealsecurity.io/
      run: |
        python -m build --sdist
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist

  build-wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.qemu }}
    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}
    timeout-minutes: 50
    needs: [pre-deploy, gen_llhttp]
    strategy:
      matrix:
        os: [ubuntu, windows, macos]
        qemu: ['']
        include:
          # Split ubuntu job for the sake of speed-up
        - os: windows
          runner: windows-2022
        - os: ubuntu
          qemu: ''
          runner: ubuntu-24.04
        - os: ubuntu
          qemu: aarch64
          runner: ubuntu-24.04-arm
        - os: ubuntu
          qemu: ppc64le
        - os: ubuntu
          qemu: s390x
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v2.4.0
      with:
        submodules: true
    - name: Set up QEMU
      if: ${{ matrix.qemu && !matrix.runner }}
      uses: docker/setup-qemu-action@v1
      with:
        platforms: all
      id: qemu
    - name: Prepare emulation
      run: |
        if [[ -n "${{ matrix.qemu }}" ]]; then
          # Build emulated architectures only if QEMU is set,
          # use default "auto" otherwise
          echo "CIBW_ARCHS_LINUX=${{ matrix.qemu }}" >> $GITHUB_ENV
        fi
      shell: bash
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Update pip, wheel, setuptools, build, twine
      run: |
        python -m pip install -U pip wheel setuptools build twine
    - name: Install cython
      run: |
        python -m pip install -r requirements/cython.txt -c requirements/constraints.txt
    - name: Restore llhttp generated files
      uses: actions/download-artifact@v4
      with:
        name: llhttp
        path: vendor/llhttp/build/
    - name: Cythonize
      run: |
        make cythonize
    - name: Build wheels
      uses: pypa/cibuildwheel@v2.16.5
      env:
        CIBW_ARCHS_MACOS: x86_64 arm64 universal2
        CIBW_SKIP: cp312-* pp*
        CIBW_ENVIRONMENT: PIP_INDEX_URL=https://:2023-10-07T14:27:15.181580Z@time-machines-pypi.sealsecurity.io/
        CIBW_DEPENDENCY_VERSIONS_MACOS: latest
    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}-${{ matrix.qemu }}
        path: ./wheelhouse/*.whl
        if-no-files-found: error

  deploy:
    name: Deploy
    needs: [build-tarball, build-wheels]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for trusted publishing & sigstore

    environment:
      name: pypi
      url: https://pypi.org/p/aiohttp

    steps:
    - name: Checkout
      uses: actions/checkout@v2.4.0
      with:
        submodules: true
    - name: Update pip, wheel, setuptools, build, twine
      run: |
        python -m pip install -U pip wheel setuptools build twine
    - name: Login
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Collected dists
      run: |
        tree dist
    - name: Make Release
      uses: aio-libs/create-release@v1.6.6
      with:
        changes_file: CHANGES.rst
        name: aiohttp
        version_file: aiohttp/__init__.py
        github_token: ${{ secrets.GITHUB_TOKEN }}
        dist_dir: dist
        fix_issue_regex: "`#(\\d+) <https://github.com/aio-libs/aiohttp/issues/\\1>`_"
        fix_issue_repl: "(#\\1)"

    - name: >-
        Publish 🐍📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v1.2.3
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl

    - name: Upload artifact signatures to GitHub Release
      # Confusingly, this action also supports updating releases, not
      # just creating them. This is what we want here, since we've manually
      # created the release above.
      uses: softprops/action-gh-release@v1
      with:
        # dist/ contains the built packages, which smoketest-artifacts/
        # contains the signatures and certificates.
        files: dist/**
